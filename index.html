<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дефекты кладки — распознавание</title><style>body{font:16px system-ui,sans-serif;max-width:650px;margin:24px auto;padding:0 16px;background:#f7f8fb;color:#20242b}h1{font-size:25px}button{padding:13px 18px;border:0;border-radius:10px;background:#155fc2;color:white;font-size:16px;margin:6px 6px 10px 0}button:disabled{opacity:.5}video{width:100%;max-height:55vh;object-fit:contain;background:#ddd;border-radius:12px}#status{margin:12px 0}.item{margin:12px 0}.head{display:flex;justify-content:space-between;gap:10px}.track{height:12px;background:#dfe6f1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#2265c6;width:0}.note{font-size:13px;color:#555}</style></head><body><h1>Распознавание дефектов кладки</h1><p>Вариант 27 · модель Teachable Machine</p><button id="start">Включить камеру</button><button id="stop" disabled>Остановить</button><div id="status" role="status">Для камеры откройте эту страницу по HTTPS и разрешите доступ.</div><video id="video" autoplay muted playsinline></video><div id="results"></div><p class="note">Учебный прототип. Предсказания не заменяют строительное обследование. Для корректного тестирования используйте новые изображения, не входившие в обучение.</p><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script><script>
const URL='https://teachablemachine.withgoogle.com/models/K7oOdGNaw/';let model,stream,running=false,frame=0;const video=document.getElementById('video'),status=document.getElementById('status'),results=document.getElementById('results');const start=document.getElementById('start'),stop=document.getElementById('stop');
function render(pred){results.replaceChildren();for(const p of pred.sort((a,b)=>b.probability-a.probability)){const item=document.createElement('div');item.className='item';const head=document.createElement('div');head.className='head';const name=document.createElement('span');name.textContent=p.className;const pct=document.createElement('strong');pct.textContent=(p.probability*100).toFixed(1)+'%';head.append(name,pct);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(p.probability*100)+'%';track.append(fill);item.append(head,track);results.append(item)}}
async function loop(){if(!running)return;try{if(video.readyState>=2){const pred=await model.predict(video);render(pred)}}catch(e){status.textContent='Ошибка распознавания: '+e.message;running=false;return}if(running)frame=requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;status.textContent='Загружаем модель и запускаем камеру…';try{if(!window.isSecureContext)throw Error('Требуется HTTPS (или localhost).');if(!navigator.mediaDevices?.getUserMedia)throw Error('Камера недоступна в этом браузере.');if(!model)model=await tmImage.load(URL+'model.json',URL+'metadata.json');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});video.srcObject=stream;await video.play();running=true;stop.disabled=false;status.textContent='Камера включена. Наведите её на кладку.';loop()}catch(e){status.textContent='Не удалось запустить: '+e.message;start.disabled=false}};
stop.onclick=()=>{running=false;cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());video.srcObject=null;stop.disabled=true;start.disabled=false;status.textContent='Камера остановлена.'};
</script></body></html>
